global:
  scrape_interval: 5s
  evaluation_interval: 5s

# Alerting rules
rule_files:
  - "alert.rules.yml"

# Scrape targets
scrape_configs:
  # 1. Placement System Flask App
  - job_name: "placement-app"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["placement-app:5000"]
        labels:
          environment: "production"
          app: "online-placement-system"

  # 2. Host Node Exporter (CPU, Memory, Disk)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          environment: "production"
          service: "system-resources"

  # 3. Prometheus Self-Monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
